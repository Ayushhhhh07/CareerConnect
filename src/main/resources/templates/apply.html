
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Apply for Internship | CareerConnect</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6fb;
            color: #222;
        }

        header {
            background: #2449b5;
            color: white;
            padding: 18px 7%;
        }

        header h2 {
            margin: 0;
        }

        .container {
            max-width: 600px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .form-card {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.07);
        }

        h1 {
            margin-top: 0;
            color: #1f326b;
        }

        .subtitle {
            color: #666;
            line-height: 1.6;
        }

        .field {
            margin-top: 22px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccd2df;
            border-radius: 7px;
            font-size: 15px;
        }

        input[readonly] {
            background: #f2f4f8;
            color: #555;
        }

        .btn {
            display: inline-block;
            width: 100%;
            margin-top: 25px;
            padding: 13px;
            border: none;
            border-radius: 7px;
            background: #2449b5;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            text-align: center;
            text-decoration: none;
        }

        .btn:hover {
            background: #19378f;
        }

        .back-link {
            display: inline-block;
            margin-top: 20px;
            color: #2449b5;
            text-decoration: none;
        }

        .error {
            color: #b42318;
            background: #fff0ef;
            padding: 12px;
            border-radius: 7px;
            margin-top: 15px;
        }

        @media (max-width: 480px) {
            .form-card {
                padding: 22px;
            }
        }
    </style>
</head>

<body>

<header>
    <h2>CareerConnect</h2>
</header>

<main class="container">

    <section class="form-card">

        <h1>Apply for Internship</h1>

        <p class="subtitle">
            Review your account details and submit your application.
        </p>

        <div class="field">
            <label for="internshipTitleDisplay">Internship</label>
            <input id="internshipTitleDisplay"
                   type="text"
                   th:value="${internshipTitle}"
                   readonly>
        </div>

        <div class="field">
            <label for="studentEmail">Registered Email</label>
            <input id="studentEmail"
                   type="email"
                   th:value="${studentEmail}"
                   readonly>
        </div>

        <form th:action="@{/apply}" th:object="${application}" method="post">

            <input type="hidden"
                   name="internshipTitle"
                   th:value="${internshipTitle}">

            <div class="field">
                <label for="phone">Phone Number</label>
                <input type="tel"
                       id="phone"
                       th:field="*{phone}"
                       placeholder="Enter your phone number"
                       pattern="[0-9]{10}"
                       maxlength="10"
                       minlength="10"
                       inputmode="numeric"
                       title="Enter a 10-digit phone number"
                       required>
            </div>

            <button type="submit" class="btn">
                Submit Application
            </button>

        </form>

        <a th:href="@{/}" class="back-link">
            ← Back to Internships
        </a>

    </section>

</main>

</body>
</html>
