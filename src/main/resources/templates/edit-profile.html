
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Profile | CareerConnect</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f3f6fc;
            color: #1e293b;
            min-height: 100vh;
        }

        nav {
            background: #172554;
            color: white;
            padding: 18px 7%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            flex-wrap: wrap;
        }

        .brand {
            font-size: 23px;
            font-weight: bold;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin-left: 18px;
            font-size: 14px;
        }

        nav a:hover {
            color: #93c5fd;
        }

        .container {
            width: 90%;
            max-width: 650px;
            margin: 45px auto;
        }

        .heading {
            margin-bottom: 25px;
        }

        .heading h1 {
            font-size: 30px;
            margin-bottom: 9px;
        }

        .heading p {
            color: #64748b;
            line-height: 1.6;
        }

        .form-card {
            background: white;
            padding: 32px;
            border-radius: 18px;
            box-shadow: 0 8px 30px rgba(15, 23, 42, 0.08);
        }

        .form-card h2 {
            font-size: 21px;
            margin-bottom: 25px;
        }

        .form-group {
            margin-bottom: 22px;
        }

        label {
            display: block;
            margin-bottom: 9px;
            font-size: 14px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 13px 14px;
            border: 1px solid #cbd5e1;
            border-radius: 9px;
            font-size: 15px;
            outline: none;
            background: white;
        }

        input:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
        }

        input[readonly] {
            background: #f1f5f9;
            color: #64748b;
            cursor: not-allowed;
        }

        .help-text {
            display: block;
            color: #64748b;
            font-size: 12px;
            margin-top: 7px;
        }

        .message {
            padding: 12px 14px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 14px;
            line-height: 1.5;
        }

        .error {
            background: #fef2f2;
            color: #b91c1c;
            border: 1px solid #fecaca;
        }

        .actions {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            margin-top: 28px;
        }

        .btn {
            display: inline-block;
            padding: 13px 18px;
            border: none;
            border-radius: 9px;
            text-decoration: none;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
            text-align: center;
        }

        .btn-primary {
            background: #2563eb;
            color: white;
        }

        .btn-primary:hover {
            background: #1d4ed8;
        }

        .btn-secondary {
            background: white;
            color: #334155;
            border: 1px solid #cbd5e1;
        }

        .btn-secondary:hover {
            background: #f8fafc;
        }

        @media (max-width: 600px) {
            nav {
                padding: 16px 5%;
            }

            nav a {
                margin-left: 0;
                margin-right: 12px;
            }

            .container {
                margin: 28px auto;
            }

            .heading h1 {
                font-size: 25px;
            }

            .form-card {
                padding: 23px 18px;
            }

            .actions .btn {
                flex: 1;
            }
        }
    </style>
</head>

<body>

<nav>
    <div class="brand">CareerConnect</div>

    <div>
        <a th:href="@{/dashboard}">Dashboard</a>
        <a th:href="@{/profile}">My Profile</a>
    </div>
</nav>

<main class="container">

    <div class="heading">
        <h1>Edit Your Profile</h1>
        <p>Keep your account information up to date.</p>
    </div>

    <section class="form-card">
        <h2>Personal Information</h2>

        <div th:if="${errorMessage}"
             class="message error"
             th:text="${errorMessage}">
            Please check your details.
        </div>

        <form th:action="@{/profile/edit}"
              th:object="${student}"
              method="post">

            <div class="form-group">
                <label for="fullName">Full Name</label>

                <input type="text"
                       id="fullName"
                       th:field="*{fullName}"
                       maxlength="100"
                       required
                       autocomplete="name"
                       placeholder="Enter your full name">
            </div>

            <div class="form-group">
                <label for="email">Email Address</label>

                <input type="email"
                       id="email"
                       th:value="${student.email}"
                       readonly>

                <span class="help-text">
                    Your registered email address cannot be changed here.
                </span>
            </div>

            <div class="actions">
                <button type="submit" class="btn btn-primary">
                    Save Changes
                </button>

                <a th:href="@{/profile}" class="btn btn-secondary">
                    Cancel
                </a>
            </div>

        </form>
    </section>

</main>

</body>
</html>
