
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile | CareerConnect</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f3f6fc;
            color: #1e293b;
            min-height: 100vh;
        }

        .navbar {
            background: #172554;
            color: white;
            padding: 18px 7%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            flex-wrap: wrap;
        }

        .brand {
            font-size: 23px;
            font-weight: bold;
        }

        .navbar a {
            color: white;
            text-decoration: none;
            margin-left: 18px;
            font-size: 14px;
        }

        .navbar a:hover {
            color: #93c5fd;
        }

        .container {
            width: 90%;
            max-width: 850px;
            margin: 45px auto;
        }

        .page-heading {
            margin-bottom: 25px;
        }

        .page-heading h1 {
            font-size: 30px;
            margin-bottom: 8px;
        }

        .page-heading p {
            color: #64748b;
            line-height: 1.6;
        }

        .profile-card {
            background: white;
            border-radius: 18px;
            overflow: hidden;
            box-shadow: 0 8px 30px rgba(15, 23, 42, 0.08);
        }

        .profile-banner {
            background: linear-gradient(135deg, #1d4ed8, #4338ca);
            color: white;
            padding: 32px;
            display: flex;
            align-items: center;
            gap: 22px;
        }

        .avatar {
            width: 82px;
            height: 82px;
            border-radius: 50%;
            background: white;
            color: #1d4ed8;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 32px;
            font-weight: bold;
            flex-shrink: 0;
        }

        .profile-banner h2 {
            font-size: 24px;
            margin-bottom: 8px;
            overflow-wrap: anywhere;
        }

        .profile-banner p {
            color: #dbeafe;
            overflow-wrap: anywhere;
        }

        .role-badge {
            display: inline-block;
            margin-top: 12px;
            padding: 6px 12px;
            background: rgba(255, 255, 255, 0.18);
            border-radius: 20px;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.7px;
        }

        .profile-details {
            padding: 30px;
        }

        .profile-details h3 {
            font-size: 19px;
            margin-bottom: 22px;
        }

        .detail-row {
            display: flex;
            justify-content: space-between;
            gap: 20px;
            padding: 19px 0;
            border-bottom: 1px solid #e2e8f0;
        }

        .detail-row:last-child {
            border-bottom: none;
        }

        .detail-label {
            color: #64748b;
            font-size: 14px;
        }

        .detail-value {
            font-weight: 600;
            text-align: right;
            overflow-wrap: anywhere;
        }

        .actions {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            margin-top: 25px;
        }

        .btn {
            display: inline-block;
            padding: 12px 18px;
            border-radius: 9px;
            text-decoration: none;
            font-weight: bold;
            font-size: 14px;
        }

        .btn-primary {
            background: #2563eb;
            color: white;
        }

        .btn-primary:hover {
            background: #1d4ed8;
        }

        .btn-secondary {
            background: white;
            color: #334155;
            border: 1px solid #cbd5e1;
        }

        .btn-secondary:hover {
            background: #f8fafc;
        }

        @media (max-width: 600px) {
            .navbar {
                padding: 16px 5%;
            }

            .navbar a {
                margin-left: 0;
                margin-right: 14px;
            }

            .container {
                margin: 28px auto;
            }

            .page-heading h1 {
                font-size: 25px;
            }

            .profile-banner {
                padding: 25px 20px;
                gap: 15px;
            }

            .avatar {
                width: 65px;
                height: 65px;
                font-size: 26px;
            }

            .profile-banner h2 {
                font-size: 19px;
            }

            .profile-details {
                padding: 22px 18px;
            }

            .detail-row {
                gap: 12px;
            }
        }
    </style>
</head>

<body>

<nav class="navbar">
    <div class="brand">CareerConnect</div>

    <div>
        <a th:href="@{/dashboard}">Dashboard</a>
        <a th:href="@{/}">Internships</a>
        <a th:href="@{/my-applications}">My Applications</a>
    </div>
</nav>

<main class="container">

    <div class="page-heading">
        <h1>My Profile</h1>
        <p>View your registered account information.</p>
    </div>

    <section class="profile-card">

        <div class="profile-banner">
            <div class="avatar"
                 th:text="${#strings.substring(student.fullName, 0, 1).toUpperCase()}">
                S
            </div>

            <div>
                <h2 th:text="${student.fullName}">Student Name</h2>
                <p th:text="${student.email}">student@example.com</p>

                <span class="role-badge"
                      th:text="${student.role}">
                    STUDENT
                </span>
            </div>
        </div>

        <div class="profile-details">
            <h3>Account Information</h3>

            <div class="detail-row">
                <span class="detail-label">Full Name</span>
                <span class="detail-value"
                      th:text="${student.fullName}">
                    Student Name
                </span>
            </div>

            <div class="detail-row">
                <span class="detail-label">Email Address</span>
                <span class="detail-value"
                      th:text="${student.email}">
                    student@example.com
                </span>
            </div>

            <div class="detail-row">
                <span class="detail-label">Account Type</span>
                <span class="detail-value"
                      th:text="${student.role}">
                    STUDENT
                </span>
            </div>

            <div class="actions">
                <a th:href="@{/dashboard}"
                   class="btn btn-primary">
                    Back to Dashboard
                </a>

                <a th:href="@{/my-applications}"
                   class="btn btn-secondary">
                    View My Applications
                </a>
            </div>
        </div>

    </section>

</main>

</body>
</html>
